[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-dev-console"
version = "1.0.0"
description = "Consola de Gestion Integral de Escritorio para Windows de la Factoria de Software con IA y AI-GRC"
readme = "README.md"
authors = [
    { name = "Sdog Farm Software Factory", email = "admin@sadogfarm.onmicrosoft.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Environment :: Win32 (MS Windows)",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance"
]

[project.scripts]
autonomous-dev-console = "console.app:main"
